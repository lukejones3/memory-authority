services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: memory_authority
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "5439:5432"
    volumes:
      - authority-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory_authority"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  authority-data:
